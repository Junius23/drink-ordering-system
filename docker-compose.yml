services:
  mysql:
    image: mysql:8.0
    container_name: useraccount-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: users_accounts
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./useraccountsystem
    container_name: useraccount-backend
    restart: always
    ports:
      - "2020:2020"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/users_accounts?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    volumes:
      - ./useraccountsystem/uploads:/app/uploads

  frontend:
    build: "./drink-del - copy/frontend"
    container_name: drink-frontend
    restart: always
    ports:
      - "5174:5173"
    depends_on:
      - backend

  frontend1:
    build: ./useraccountfrontend
    container_name: useraccount-frontend
    restart: always
    ports:
      - "5175:3000"
    depends_on:
      - backend

volumes:
  mysql_data: